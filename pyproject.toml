[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "orcaslicer-matrix"
version = "2.0.3"
description = "Modern desktop matrix slicing and comparison studio for OrcaSlicer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Keep the frozen Windows runtime on the verified Qt 6.8 line. PySide6
    # 6.11.2 currently produces a PyInstaller bundle that fails to import
    # QtCore on Windows with ERROR_PROC_NOT_FOUND.
    "PySide6==6.8.3",
    "httpx>=0.27,<1",
    "keyring>=25,<26",
]
license = { text = "MIT" }
authors = [
    { name = "OrcaSlicer Contributors" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]

[project.scripts]
orcaslicer-matrix = "orcaslicer_matrix.cli:main"
orcaslicer-matrix-studio = "orcaslicer_matrix.studio:main"

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-qt>=4.4,<5",
    "pyinstaller>=6.10,<7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["orcaslicer_matrix*"]

[tool.setuptools.package-data]
"*" = ["print_settings_schema.json"]

[tool.pytest.ini_options]
addopts = "--basetemp=.pytest_tmp"

